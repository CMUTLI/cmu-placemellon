default_install_hook_types: [pre-commit]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: eslint
        name: ESLint
        entry: npm run lint
        language: system
        pass_filenames: false
      - id: prettier
        name: Prettier
        entry: npm run format:check
        language: system
        pass_filenames: false
      - id: typecheck
        name: TypeScript
        entry: npm run typecheck
        language: system
        pass_filenames: false
      - id: check-node
        name: Node version
        entry: npm run check:node
        language: system
        pass_filenames: false
        files: ^(Dockerfile|package\.json|scripts/check-node-version\.mjs)$
